name: Build ELG Piano APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Télécharger les SoundFonts depuis la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in Yamaha_C5_Pianoteq.sf2 Bright_Synth.sf2; do
            gh release download soundfonts --repo "$GITHUB_REPOSITORY" --pattern "$f" --dir . \
              || { echo "Impossible de télécharger $f depuis la Release 'soundfonts'"; exit 1; }
          done

      - name: Exécuter le script pour générer le projet
        run: |
          chmod +x setup_elg_piano_full.sh
          bash setup_elg_piano_full.sh

      - name: Installer SDK, NDK et CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK de debug
        run: gradle --no-daemon assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ELG-Piano-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
